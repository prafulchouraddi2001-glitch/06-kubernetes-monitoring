apiVersion: v1
kind: Pod
metadata:
  name: node-affinity-notin
  namespace: devops-app

spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: workload
                operator: NotIn
                values:
                  - production

  containers:
    - name: test
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
