apiVersion: v1
kind: Pod
metadata:
  name: storage-test
  namespace: devops-app
spec:
  containers:
    - name: storage-test
      image: nginx:1.27
      volumeMounts:
        - name: webapp-data
          mountPath: /data
  volumes:
    - name: webapp-data
      persistentVolumeClaim:
        claimName: webapp-data
