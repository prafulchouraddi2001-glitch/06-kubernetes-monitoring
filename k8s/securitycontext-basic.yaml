apiVersion: v1
kind: Pod

metadata:
  name: securitycontext-hardened
  namespace: devops-app

spec:
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 2000

  containers:
    - name: security-test
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]

      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL

      volumeMounts:
        - name: security-data
          mountPath: /data

  volumes:
    - name: security-data
      emptyDir: {}
