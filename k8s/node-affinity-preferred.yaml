apiVersion: v1
kind: Pod
metadata:
  name: node-affinity-preferred
  namespace: devops-app

spec:
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: workload
                operator: In
                values:
                  - devops

  containers:
    - name: test
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
